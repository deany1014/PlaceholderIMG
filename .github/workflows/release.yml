name: Build Windows release

on:
  # Runs when you push a version tag such as v1.0.0
  push:
    tags:
      - "v*"
  # Lets you run a test build manually from the Actions tab (no release is created)
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download Poppins font and its license
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/Poppins-Black.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Black.ttf
          curl -fsSL -o OFL.txt https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/OFL.txt

      - name: Build placeholder.exe
        run: pyinstaller --onefile --name placeholder --add-data "fonts/Poppins-Black.ttf;fonts" placeholder.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: placeholder-windows
          path: |
            dist/placeholder.exe
            OFL.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/placeholder.exe OFL.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes